name: Release

on:
  push:
    tags:
      - "v*"
  # タグを打つ前に CI でビルドが通るか試すため。Release は作らず成果物だけ残す
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          # uv.lock が無いのでキャッシュは効かない(警告を出さないよう明示的に無効化)
          enable-cache: false

      - name: Install pebble-tool and SDK
        run: |
          uv tool install pebble-tool
          pebble sdk install latest
          pebble sdk list

      # タグ v0.1.0 と package.json の "0.1.0" が食い違ったまま配布しないようにする
      - name: Check version matches tag
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "package.json version ($version) does not match tag (${GITHUB_REF_NAME})" >&2
            exit 1
          fi

      - name: Build
        run: |
          pebble build
          version=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          mkdir -p dist
          cp build/*.pbw "dist/reconstruction-$version.pbw"

      - uses: actions/upload-artifact@v7
        with:
          name: pbw
          path: dist/*.pbw

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.pbw
          # .pbw にはフォントを組み込んでいるため、OFL の条件として著作権表示とライセンスを配布物に添える
          # (body は自動生成のリリースノートの前に置かれる)
          body: |
            ## Fonts

            This watchface embeds the following fonts, licensed under the [SIL Open Font License, Version 1.1](https://openfontlicense.org).

            - Saira — Copyright 2020 The Saira Project Authors ([license](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/resources/fonts/OFL-Saira.txt))
            - Outfit — Copyright 2021 The Outfit Project Authors ([license](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/resources/fonts/OFL-Outfit.txt))

            The source code is released under the [MIT License](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/LICENSE).
          generate_release_notes: true
